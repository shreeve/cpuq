name: App

# The macOS menu-bar app in app/: build (warnings are errors) and test it
# whenever it changes. The CLI's own workflows never build it.

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app.yml']
  pull_request:
    branches: [main]
    paths: ['app/**', '.github/workflows/app.yml']

permissions:
  contents: read

jobs:
  app:
    name: Build and test (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: swift build

      - name: Test
        run: swift test
