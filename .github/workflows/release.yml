name: Release

# A `vX.Y.Z` tag publishes a release. The tag must match build.zig.zon's
# version and CHANGELOG.md must have its section, whose text becomes the
# release notes. Each runner tests natively, then cross-builds its two
# targets in safe mode (static musl on Linux, libSystem only on macOS) and
# packs them with scripts/package-release.sh. The publish job hashes
# exactly the archives it publishes, signs the checksums with cosign
# keyless through GitHub OIDC, and creates the release. Assets:
#
#   cpuq-vX.Y.Z-{osx-arm64,osx-amd64,linux-amd64,linux-arm64}.tar.gz
#   cpuq-vX.Y.Z-checksums.txt          what install.sh checks
#   cpuq-vX.Y.Z-checksums.txt.bundle   the cosign signature over it

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  ZIG_VERSION: "0.17.0"

jobs:
  build:
    name: Test and build (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            targets: 'x86_64-linux-musl:linux-amd64 aarch64-linux-musl:linux-arm64'
          - os: macos-latest
            targets: 'aarch64-macos:osx-arm64 x86_64-macos:osx-amd64'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag against build.zig.zon and CHANGELOG.md
        run: |
          tag=$GITHUB_REF_NAME
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::tag $tag is not vX.Y.Z"; exit 1; }
          zon=$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' build.zig.zon)
          [ "${tag#v}" = "$zon" ] || { echo "::error::tag $tag does not match build.zig.zon's version $zon"; exit 1; }
          grep -q "^## ${tag#v} " CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## ${tag#v}' section"; exit 1; }

      - name: Install Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Unit tests
        run: zig build test --summary all

      - name: End-to-end tests
        run: |
          zig build -Doptimize=safe
          test/run.sh

      - name: Build and pack
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          for pair in $TARGETS; do
            target=${pair%%:*} plat=${pair##*:}
            zig build install -Doptimize=safe -Dtarget="$target" -Dversion="${GITHUB_REF_NAME#v}" -p "out/$target"
            TAG="$GITHUB_REF_NAME" PLAT="$plat" BINARY="out/$target/bin/cpuq" OUT=dist scripts/package-release.sh
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.os }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Checksums and notes
        run: |
          mkdir publish
          cp artifacts/*/*.tar.gz publish/
          n=$(ls publish/*.tar.gz | wc -l)
          [ "$n" = 4 ] || { echo "::error::expected 4 archives, found $n"; exit 1; }
          (cd publish && sha256sum *.tar.gz > "cpuq-$GITHUB_REF_NAME-checksums.txt")
          cat "publish/cpuq-$GITHUB_REF_NAME-checksums.txt"
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## " v " ") == 1 { p = 1; next } /^## / && p { exit } p' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::empty release notes"; exit 1; }

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      - name: Sign the checksums (cosign keyless)
        run: |
          cd publish
          cosign sign-blob --yes --bundle "cpuq-$GITHUB_REF_NAME-checksums.txt.bundle" "cpuq-$GITHUB_REF_NAME-checksums.txt"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "cpuq $GITHUB_REF_NAME" --notes-file notes.md $prerelease publish/*
