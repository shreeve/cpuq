<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="free" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2236"/>
      <stop offset="1" stop-color="#0A0E1A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.33" cy="0.42" r="0.45">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <!-- the mark: 490 x 545 units, scaled to about 300 px tall -->
  <g transform="translate(250 110) scale(0.56) translate(-240 -180)">
  <g transform="translate(40 0)" stroke-linecap="round" fill="none">
    <!-- pins -->
    <g stroke="url(#ink)" stroke-width="34">
      <path d="M382 212v58M472 212v58M562 212v58"/>
      <path d="M232 362h58M232 452h58M232 542h58"/>
      <path d="M382 634v58M472 634v58"/>
    </g>
    <!-- chip body -->
    <rect x="292" y="272" width="360" height="360" rx="72" stroke="url(#ink)" stroke-width="44"/>
    <!-- cores: three held, one free -->
    <g stroke="none">
      <rect x="348" y="328" width="110" height="110" rx="24" fill="url(#core)"/>
      <rect x="486" y="328" width="110" height="110" rx="24" fill="url(#core)"/>
      <rect x="348" y="466" width="110" height="110" rx="24" fill="url(#core)"/>
      <rect x="486" y="466" width="110" height="110" rx="24" fill="url(#free)"/>
    </g>
  </g>
  </g>
  <text x="575" y="312" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500" font-size="200" letter-spacing="-4" fill="#F1F5F9">cpuq</text>
  <text x="640" y="530" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="31" fill="#94A3B8">A machine-wide jobserver for builds, tests, benchmarks and coding agents</text>
</svg>
