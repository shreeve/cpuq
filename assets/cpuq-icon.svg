<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2236"/>
      <stop offset="1" stop-color="#0A0E1A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="free" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: 824pt body, 100pt margin -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  <g transform="translate(40 0)" stroke-linecap="round" fill="none">
    <!-- pins -->
    <g stroke="url(#ink)" stroke-width="34">
      <path d="M382 212v58M472 212v58M562 212v58"/>
      <path d="M232 362h58M232 452h58M232 542h58"/>
      <path d="M382 634v58M472 634v58"/>
    </g>
    <!-- chip body -->
    <rect x="292" y="272" width="360" height="360" rx="72" stroke="url(#ink)" stroke-width="44"/>
    <!-- cores: three held, one free -->
    <g stroke="none">
      <rect x="348" y="328" width="110" height="110" rx="24" fill="url(#core)"/>
      <rect x="486" y="328" width="110" height="110" rx="24" fill="url(#core)"/>
      <rect x="348" y="466" width="110" height="110" rx="24" fill="url(#core)"/>
      <rect x="486" y="466" width="110" height="110" rx="24" fill="url(#free)"/>
    </g>
  </g>
</svg>
